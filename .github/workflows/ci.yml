name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test-and-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
            
            - name: Run tests
              run: go test ./...
                
            - name: Buid Docker image
              run: docker built -t ecom-backend .