name: CI-CD

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test-and-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
            
            - name: Run tests
              run: go test ./...
                
    push-image:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: test-and-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME}}
                password: ${{ secrets.DOCKERHUB_TOKEN}}
            - name: Build and push backend image
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME}}/ecom-backend:latest

            - name: Build and push migrations image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: Dockerfile.migrations
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME}}/ecom-migrations:latest

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: push-image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Copy compose file to VM
              uses: appleboy/scp-action@v1
              with:
                host: ${{ secrets.VM_HOST}}
                username: ${{ secrets.VM_USER }}
                key: ${{ secrets.VM_SSH_KEY }}
                source: docker-compose.yml
                target: ~/ecom

            - name: Deploy on VM
              uses: appleboy/ssh-action@v1
              env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                POSTGRES_DB: ecom
              with:
                host: ${{ secrets.VM_HOST }}
                username: ${{ secrets.VM_USER }}
                key: ${{ secrets.VM_SSH_KEY }}
                envs: DOCKERHUB_USERNAME,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB
                script: |
                    cd ~/ecom
                    docker compose pull backend migrate
                    docker compose up -d --no-build --pull always
                    curl --fail --retry 10 --retry-delay 2 http://localhost:8000/health
            
    deploy-aks:
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      needs: push-image
      runs-on: ubuntu-latest

      permissions:
        contents: read
        id-token: write
      
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Login to azure
          uses: azure/login@v3
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
        - name: Setup AKS context
          uses: azure/aks-set-context@v5
          with:
            resource-group: ecom-tf-rg
            cluster-name: ecom-aks
            admin: true

        - name: Create namespace
          run: |
            kubectl apply -f k8s/aks/namespace.yaml
        
        - name: Create Postgres secret
          env:
            POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          run: kubectl create secret generic postgres-secret --namespace ecom --from-literal=POSTGRES_USER=$POSTGRES_USER --from-literal=POSTGRES_PASSWORD=$POSTGRES_PASSWORD --from-literal=POSTGRES_DB=$POSTGRES_DB --dry-run=client -o yaml | kubectl apply -f -

        - name: Create backend secret
          env:
            GOOSE_DBSTRING: ${{ secrets.GOOSE_DBSTRING }}
          run: kubectl create secret generic backend-secret --namespace ecom --from-literal="GOOSE_DBSTRING=$GOOSE_DBSTRING" --dry-run=client -o yaml | kubectl apply -f -

        - name: Deploy Postgres
          run: |
            kubectl apply -n ecom -f k8s/aks/postgres.yaml
            kubectl wait \
              --for=condition=ready pod \
              -l app=postgres \
              -n ecom \
              --timeout=120s
        
        - name: Run goose migrations
          run: |
            kubectl delete job ecom-migrations \
              -n ecom \
              --ignore-not-found=true

            kubectl apply -n ecom -f k8s/aks/migration-job.yaml

            kubectl wait \
              --for=condition=complete job/ecom-migrations \
              -n ecom \
              --timeout=120s
        
        - name: Deploy backend
          run: |
            kubectl apply -n ecom -f k8s/aks/backend.yaml
            kubectl apply -n ecom -f k8s/aks/backend-ingress.yaml
            kubectl rollout restart deployment backend-service -n ecom
            kubectl rollout status deployment backend-service -n ecom --timeout=120s

        - name: Health check
          run: |
            INGRESS_IP=$(kubectl get service nginx \
              -n app-routing-system \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            curl --fail --retry 10 --retry-delay 5 \
              "http://${INGRESS_IP}/health"
