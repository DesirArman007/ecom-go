apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: desirarman/ecom-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
          - secretRef:
                name: backend-secret
          env:
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: GOOSE_DBSTRING
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-external-service
spec: 
  selector:
    app: backend
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080